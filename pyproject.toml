[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "admixbench"
version = "0.1.0"
description = "Simulation benchmark for admixture graph inference from f-statistics"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["msprime", "numpy", "pandas", "networkx", "matplotlib", "pyyaml"]

[tool.setuptools]
packages = ["admixbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end tests that need Rscript and ADMIXTOOLS 2"]
